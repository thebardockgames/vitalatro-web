<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitalatro</title>
<meta name="description" content="Make the Vitalatro VPK for PS Vita from your own copy of Balatro. Nothing is uploaded: it all happens in your browser.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="crt" aria-hidden="true"></div>

<main>
  <nav class="langs" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="false">EN</button>
    <button type="button" data-lang="es" aria-pressed="false">ES</button>
  </nav>
  <header class="hero">
    <h1 class="title" data-i18n="title">Vitalatro</h1>
    <p class="tagline" data-i18n="tagline">Balatro on your PS Vita</p>
  </header>

  <section class="card intro">
    <p data-i18n="intro1"></p>
    <p class="private" data-i18n="intro2"></p>
  </section>

  <section class="card news" id="news" hidden>
    <h2><span data-i18n="news_title"></span> <span class="mono" id="news-version"></span></h2>
    <ul id="news-list"></ul>
    <p class="note" data-i18n="news_check"></p>
  </section>

  <section class="card step" id="step-file">
    <h2><span class="num">1</span> <span data-i18n="step1"></span></h2>
    <label class="drop" id="drop" tabindex="0">
      <input type="file" id="file" accept=".exe,.apk,application/vnd.android.package-archive,application/x-msdownload">
      <span class="drop-icon" aria-hidden="true"></span>
      <span class="drop-main" data-i18n="drop_main"></span>
      <span class="drop-sub" data-i18n="drop_sub"></span>
    </label>
    <details class="help">
      <summary data-i18n="where_file"></summary>
      <ul data-i18n="where_file_body"></ul>
    </details>
    <div class="status" id="file-status" role="status" aria-live="polite" hidden></div>
  </section>

  <section class="card step" id="step-save">
    <h2><span class="num">+</span> <span data-i18n="save_title"></span></h2>
    <p data-i18n="save_body"></p>
    <label class="drop small" id="save-drop" tabindex="0">
      <input type="file" id="save-dir" webkitdirectory multiple>
      <span class="drop-main" data-i18n="save_drop_main"></span>
      <span class="drop-sub" data-i18n="save_drop_sub"></span>
    </label>
    <details class="help">
      <summary data-i18n="where_save"></summary>
      <ul data-i18n="where_save_body"></ul>
    </details>
    <div class="status" id="save-status" role="status" aria-live="polite" hidden></div>
  </section>

  <section class="card step" id="step-build" aria-disabled="true">
    <h2><span class="num">2</span> <span data-i18n="step2"></span></h2>
    <button class="btn primary" id="build" disabled data-i18n="build"></button>
    <div class="progress" id="progress" hidden>
      <div class="bar"><div class="fill" id="progress-fill"></div></div>
      <div class="progress-label"><span id="progress-text"></span><span id="progress-pct">0%</span></div>
    </div>
    <div class="status" id="build-status" role="status" aria-live="polite" hidden></div>
    <a class="btn download" id="download" hidden download="Vitalatro.vpk" data-i18n="download"></a>
  </section>

  <section class="card step" id="step-install">
    <h2><span class="num">3</span> <span data-i18n="step3"></span></h2>
    <ol class="install" data-i18n="install"></ol>
  </section>

  <footer>
    <p data-i18n="footer"></p>
  </footer>
</main>

<script src="js/i18n.js"></script>
<script src="js/background.js"></script>
<script src="js/app.js"></script>
</body>
</html>
